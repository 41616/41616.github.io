<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title id="title">打call之诗</title>
	</head>
	<body>
		<div style="margin-left:35px;font-family:simsun;">
			<div id="div">
				<h2>打call之诗</h2>
				请输入你想打call的人的六位学号+姓名：<input id='name' type='text'><br><br>
				<button onclick="go()">生成打call之诗</button><br><br>
        注：此打call之诗由280270原创，在上中wiki上的词条为“2802打call之诗”。
			</div>
		</div>
		<script type="text/javascript">
			var div=document.getElementById("div");
			var title=document.getElementById("title");
			function go(){
        var name=document.getElementById("name").value;
				title.innerHTML= `写给${name}的打call之诗`;
				div.innerHTML= `${name}，沉鱼落雁！<br><br>${name}，聪明绝顶！<br><br>${name}，举世无双！<br><br>${name}，举世无双！<br><br>${name}，聪明绝顶！<br><br>${name}，沉鱼落雁！<br><br>${name}，才华横溢！<br><br>${name}，闭月羞花！<br><br>${name}，倾国倾城！<br><br>${name}，神机妙算！<br><br>${name}，国色天香！<br><br>${name}，花容月貌！<br><br>${name}，风华绝代！<br><br>${name}，秀外慧中！<br><br>${name}，千娇百媚！<br><br>${name}，天生丽质！<br><br>${name}，蕙质兰心！<br><br>${name}，百伶百俐！<br><br>${name}，才高八斗！<br><br>${name}，学富五车！<br><br>${name}，博览群书！<br><br>${name}，通古烁今！<br><br>${name}，博闻强记！<br><br>${name}，智周万物！<br><br>${name}，卓尔不群！<br><br>${name}，出类拔萃！<br><br>${name}，凤毛麟角！<br><br>${name}，宇宙第一！<br><br>${name}，无人能敌！<br><br>`;
			}
		</script>
	</body>
</html>
